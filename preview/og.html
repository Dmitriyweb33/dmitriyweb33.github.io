<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#f3f0e9;color:#141311;font-family:'Golos Text',sans-serif;padding:56px 64px 40px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
  .top{display:flex;align-items:center;gap:16px}
  .mark{width:56px;height:56px;border-radius:50%;background:#141311;color:#f3f0e9;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:20px;font-weight:500;flex:none}
  .name{font-size:20px;font-weight:600;line-height:1.15}
  .name small{display:block;font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:#6b655c;margin-top:5px}
  .label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6b655c;margin-top:2px}
  h1{font-family:'Unbounded',sans-serif;font-weight:500;font-size:70px;line-height:1.02;letter-spacing:-.045em;margin:0;max-width:1060px}
  h1 em{font-style:normal;color:#c8431f}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #d6d0c2;padding-top:22px}
  .bottom b{font-family:'Unbounded',sans-serif;font-weight:500;font-size:28px;letter-spacing:-.02em}
  .bottom span{font-size:14px;color:#6b655c}
</style>
<div class="top">
  <span class="mark">Д</span>
  <span class="name">Дмитрий<small>сайты для ресторанов</small></span>
  <span class="label" style="margin-left:auto">Краснодар · 2026</span>
</div>
<h1>Сайт, после которого <em>бронируют</em> стол</h1>
<div class="bottom">
  <b>45 000 ₽ <span style="font-family:'Golos Text',sans-serif;font-size:15px;font-weight:400;color:#6b655c">под ключ</span></b>
  <span>Запуск за 3–5 дней · меню, бронь, карта, мобильная версия</span>
</div>
